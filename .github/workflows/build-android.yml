name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check files
        run: |
          test -f www/index.html || (echo "www/index.html not found" && exit 1)
          test -f assets/icon-only.png || (echo "assets/icon-only.png not found" && exit 1)
          file assets/icon-only.png

      - name: Install
        run: npm install

      - name: Add Android project
        run: npx cap add android

      - name: Notification permissions and 3-second alarm sound
        run: |
          python3 - <<'PY'
          import wave, struct, math, os
          os.makedirs("android/app/src/main/res/raw", exist_ok=True)
          r = 22050
          w = wave.open("android/app/src/main/res/raw/done.wav", "wb")
          w.setnchannels(1); w.setsampwidth(2); w.setframerate(r)
          for i in range(r * 3):
              t = i / r
              k = int(t / 0.5)
              on = (t - k * 0.5) < 0.4
              f = 1175 if k % 2 == 0 else 880
              v = int(0.6 * 32767 * math.sin(2 * math.pi * f * t)) if on else 0
              w.writeframes(struct.pack("<h", v))
          w.close()
          p = "android/app/src/main/AndroidManifest.xml"
          m = open(p, encoding="utf-8").read()
          perms = "".join('    <uses-permission android:name="android.permission.%s" />\n' % x for x in ["POST_NOTIFICATIONS", "SCHEDULE_EXACT_ALARM", "USE_EXACT_ALARM", "RECEIVE_BOOT_COMPLETED", "VIBRATE", "WAKE_LOCK"])
          m = m.replace("<application", perms + "    <application", 1)
          open(p, "w", encoding="utf-8").write(m)
          PY

      - name: Apply my icon as the app launcher icon
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          import os, glob, shutil
          res = "android/app/src/main/res"
          src = Image.open("assets/icon-only.png").convert("RGBA")
          print("icon size:", src.size)
          # remove the default adaptive icon and every default launcher icon
          shutil.rmtree(res + "/mipmap-anydpi-v26", ignore_errors=True)
          for f in glob.glob(res + "/mipmap-*/ic_launcher*"):
              os.remove(f)
          for d, s in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              p = f"{res}/mipmap-{d}"
              os.makedirs(p, exist_ok=True)
              im = ImageOps.fit(src, (s, s), Image.LANCZOS)
              im.save(f"{p}/ic_launcher.png")
              mask = Image.new("L", (s, s), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, s - 1, s - 1), fill=255)
              rd = im.copy()
              rd.putalpha(mask)
              rd.save(f"{p}/ic_launcher_round.png")
          PY
          ls -R android/app/src/main/res | grep ic_launcher

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sanad-Android
          path: android/app/build/outputs/apk/debug/*.apk
