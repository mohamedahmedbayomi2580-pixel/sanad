name: Generate Icons

on:
  workflow_dispatch:

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check source image
        run: |
          test -f assets/icon-only.png || (echo "assets/icon-only.png not found" && exit 1)
          file assets/icon-only.png

      - name: Install
        run: npm install

      - name: Add Android project
        run: npx cap add android

      - name: Generate icons
        run: npx capacitor-assets generate --android --iconBackgroundColor "#ffffff"

      - name: Upload icons
        uses: actions/upload-artifact@v4
        with:
          name: Sanad-Icons
          path: android/app/src/main/res/mipmap-*
