name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check files
        run: |
          test -f www/index.html || (echo "www/index.html not found" && exit 1)
          test -f assets/icon-only.png || (echo "assets/icon-only.png not found" && exit 1)
          file assets/icon-only.png

      - name: Install
        run: npm install

      - name: Add Android project
        run: npx cap add android

      - name: Generate app icon (launcher icon)
        run: npx capacitor-assets generate --android --iconBackgroundColor "#ffffff"

      - name: Verify icon was created
        run: ls android/app/src/main/res/mipmap-xxxhdpi

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sanad-Android
          path: android/app/build/outputs/apk/debug/*.apk
